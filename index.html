<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI - ChatGPT Clone</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome & Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .prose pre { padding: 0 !important; background: transparent !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden font-sans">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between transition-all duration-300 z-20">
    <div class="p-4 flex flex-col h-full overflow-hidden">
      <!-- App Title -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">N</div>
          <span class="font-bold text-lg tracking-wide text-white">Nexus AI</span>
        </div>
      </div>

      <!-- New Chat Button -->
      <button id="new-chat-btn" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium flex items-center justify-center gap-2 transition shadow-lg shadow-blue-600/20 mb-4">
        <i class="fa-solid fa-plus"></i> New Conversation
      </button>

      <!-- Chat History -->
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">History</div>
      <div id="chat-list" class="flex-1 overflow-y-auto space-y-1 pr-1"></div>

      <!-- Footer Info & Settings -->
      <div class="border-t border-slate-800 pt-3 mt-auto space-y-2">
        <button id="open-settings-btn" class="w-full text-left px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 rounded-lg flex items-center justify-between transition">
          <span class="flex items-center gap-2"><i class="fa-solid fa-gear text-slate-400"></i> Settings & Keys</span>
          <span id="key-badge" class="text-[10px] px-2 py-0.5 rounded font-mono bg-red-950 text-red-400 border border-red-800">No Key</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col h-full relative bg-slate-950">
    <!-- Top Bar -->
    <header class="h-14 border-b border-slate-800/80 px-4 flex items-center justify-between bg-slate-950/80 backdrop-blur">
      <div class="flex items-center gap-3">
        <!-- Model Selector -->
        <select id="model-select" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500 font-medium">
          <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash (Recommended)</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Ultra Fast)</option>
          <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <button id="export-btn" title="Export Chat" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition"><i class="fa-solid fa-download"></i></button>
        <button id="clear-btn" title="Clear Chat" class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
      </div>
    </header>

    <!-- Message Window -->
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl mx-auto w-full">
      <!-- Welcome Screen -->
      <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4 my-auto">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-3xl font-bold shadow-xl shadow-blue-500/20 text-white">
          N
        </div>
        <h1 class="text-2xl font-bold text-slate-100">How can Nexus AI help you today?</h1>
        <p class="text-slate-400 text-sm max-w-md">Make sure to add your Gemini API key in Settings at the bottom left to start chatting!</p>
      </div>
    </div>

    <!-- Input Bar -->
    <div class="p-4 border-t border-slate-800/60 bg-slate-950">
      <div class="max-w-4xl mx-auto relative flex items-center bg-slate-900 border border-slate-800 rounded-2xl focus-within:border-blue-500/60 shadow-xl transition">
        <textarea id="user-input" rows="1" placeholder="Ask Nexus AI anything..." class="w-full bg-transparent px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none resize-none max-h-48 text-sm md:text-base"></textarea>
        <button id="send-btn" class="mr-2 p-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:hover:bg-blue-600 text-white rounded-xl transition flex items-center justify-center shadow-md">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
      <div class="text-center text-[11px] text-slate-500 mt-2">Nexus AI uses official Google Gemini REST APIs. Direct client connection.</div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-5 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg text-slate-100">Nexus AI Settings</h3>
        <button id="close-settings" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Gemini API Key</label>
          <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500 font-mono">
          <p class="text-xs text-slate-400 mt-1.5">Saved locally in your browser storage.</p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">System Instructions</label>
          <textarea id="system-prompt-input" rows="3" placeholder="You are Nexus AI, a helpful assistant..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="save-settings-btn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-sm transition">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Application Engine -->
  <script>
    // State Management
    let apiKey = localStorage.getItem('nexus_api_key') || '';
    let systemPrompt = localStorage.getItem('nexus_system_prompt') || 'You are Nexus AI, a helpful, intelligent assistant.';
    let conversations = JSON.parse(localStorage.getItem('nexus_conversations') || '[]');
    let currentChatId = localStorage.getItem('nexus_current_chat_id') || null;

    // Elements
    const messagesContainer = document.getElementById('messages-container');
    const welcomeScreen = document.getElementById('welcome-screen');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const modelSelect = document.getElementById('model-select');
    const chatList = document.getElementById('chat-list');
    const keyBadge = document.getElementById('key-badge');
    const apiKeyInput = document.getElementById('api-key-input');
    const systemPromptInput = document.getElementById('system-prompt-input');
    const settingsModal = document.getElementById('settings-modal');

    // Init
    function init() {
      updateKeyStatus();
      renderChatList();
      if (currentChatId) loadChat(currentChatId);

      // Auto-resize textarea
      userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
      });

      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      sendBtn.addEventListener('click', sendMessage);
      document.getElementById('new-chat-btn').addEventListener('click', createNewChat);
      document.getElementById('clear-btn').addEventListener('click', clearCurrentChat);
      document.getElementById('export-btn').addEventListener('click', exportChat);
      
      // Settings Events
      document.getElementById('open-settings-btn').addEventListener('click', () => {
        apiKeyInput.value = apiKey;
        systemPromptInput.value = systemPrompt;
        settingsModal.classList.remove('hidden');
      });

      document.getElementById('close-settings').addEventListener('click', () => settingsModal.classList.add('hidden'));
      document.getElementById('save-settings-btn').addEventListener('click', () => {
        apiKey = apiKeyInput.value.trim();
        systemPrompt = systemPromptInput.value.trim();
        localStorage.setItem('nexus_api_key', apiKey);
        localStorage.setItem('nexus_system_prompt', systemPrompt);
        updateKeyStatus();
        settingsModal.classList.add('hidden');
      });
    }

    function updateKeyStatus() {
      if (apiKey) {
        keyBadge.textContent = 'Active';
        keyBadge.className = 'text-[10px] px-2 py-0.5 rounded font-mono bg-emerald-950 text-emerald-400 border border-emerald-800';
      } else {
        keyBadge.textContent = 'No Key';
        keyBadge.className = 'text-[10px] px-2 py-0.5 rounded font-mono bg-red-950 text-red-400 border border-red-800';
      }
    }

    function getCurrentChat() {
      return conversations.find(c => c.id === currentChatId);
    }

    function createNewChat() {
      const newChat = {
        id: Date.now().toString(),
        title: 'New Conversation',
        messages: []
      };
      conversations.unshift(newChat);
      currentChatId = newChat.id;
      saveConversations();
      renderChatList();
      renderMessages();
    }

    function saveConversations() {
      localStorage.setItem('nexus_conversations', JSON.stringify(conversations));
      localStorage.setItem('nexus_current_chat_id', currentChatId);
    }

    function loadChat(id) {
      currentChatId = id;
      saveConversations();
      renderChatList();
      renderMessages();
    }

    function clearCurrentChat() {
      if (!currentChatId) return;
      conversations = conversations.filter(c => c.id !== currentChatId);
      currentChatId = conversations.length ? conversations[0].id : null;
      saveConversations();
      renderChatList();
      renderMessages();
    }

    function renderChatList() {
      chatList.innerHTML = '';
      conversations.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-3 py-2 rounded-lg text-sm truncate flex items-center gap-2 transition ${c.id === currentChatId ? 'bg-slate-800 text-white font-medium' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`;
        btn.innerHTML = `<i class="fa-regular fa-message text-xs"></i> <span class="truncate">${c.title}</span>`;
        btn.onclick = () => loadChat(c.id);
        chatList.appendChild(btn);
      });
    }

    function renderMessages() {
      const chat = getCurrentChat();
      messagesContainer.innerHTML = '';

      if (!chat || chat.messages.length === 0) {
        messagesContainer.appendChild(welcomeScreen);
        return;
      }

      chat.messages.forEach(m => appendMessageToDOM(m.role, m.content));
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendMessageToDOM(role, content) {
      const isUser = role === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;

      const avatar = isUser 
        ? `<div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center font-semibold text-xs text-slate-200 flex-shrink-0">You</div>`
        : `<div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xs text-white flex-shrink-0">N</div>`;

      const parsedContent = isUser ? content : marked.parse(content);

      const msgBubble = document.createElement('div');
      msgBubble.className = `max-w-2xl rounded-2xl px-4 py-3 text-sm md:text-base leading-relaxed ${
        isUser 
          ? 'bg-blue-600 text-white rounded-tr-none' 
          : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none prose prose-invert max-w-none'
      }`;
      msgBubble.innerHTML = parsedContent;

      if (isUser) {
        wrapper.appendChild(msgBubble);
        wrapper.appendChild(avatar);
      } else {
        wrapper.appendChild(avatar);
        wrapper.appendChild(msgBubble);
      }

      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Apply code highlighting
      if (!isUser) {
        msgBubble.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
      }

      return msgBubble;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert('Please enter your Gemini API Key in Settings first!');
        settingsModal.classList.remove('hidden');
        return;
      }

      if (!currentChatId) createNewChat();
      const chat = getCurrentChat();

      // Update title if first message
      if (chat.messages.length === 0) {
        chat.title = text.slice(0, 28) + (text.length > 28 ? '...' : '');
        renderChatList();
      }

      // Append user msg
      chat.messages.push({ role: 'user', content: text });
      userInput.value = '';
      userInput.style.height = 'auto';
      renderMessages();

      // Append placeholder bot msg
      const model = modelSelect.value;
      const botWrapper = document.createElement('div');
      botWrapper.className = 'flex gap-3 justify-start';
      botWrapper.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xs text-white flex-shrink-0">N</div>
        <div class="bg-slate-900 border border-slate-800 text-slate-200 rounded-2xl rounded-tl-none px-4 py-3 text-sm prose prose-invert max-w-none flex items-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-blue-500"></i> Thinking...
        </div>
      `;
      messagesContainer.appendChild(botWrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        // Format payload for Gemini REST API
        const contents = chat.messages.map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content }]
        }));

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: contents,
            systemInstruction: { parts: [{ text: systemPrompt }] }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API request failed');
        }

        const reply = data.candidates[0].content.parts[0].text;
        chat.messages.push({ role: 'model', content: reply });
        saveConversations();
        renderMessages();

      } catch (err) {
        botWrapper.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-bold text-xs text-white flex-shrink-0">N</div>
          <div class="bg-red-950/50 border border-red-800 text-red-300 rounded-2xl rounded-tl-none px-4 py-3 text-sm">
            ❌ Error: ${err.message}
          </div>
        `;
      }
    }

    function exportChat() {
      const chat = getCurrentChat();
      if (!chat) return;
      const blob = new Blob([JSON.stringify(chat, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
      a.click();
    }

    // Launch App
    init();
  </script>
</body>
</html>
